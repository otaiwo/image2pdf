version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: image2pdf-app
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./storage:/var/www/html/storage
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - LOG_CHANNEL=stderr
      - DB_HOST=db
      - DB_DATABASE=image2pdf
      - DB_USERNAME=app_user
      - DB_PASSWORD=secret
    networks:
      - image2pdf-network

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: image2pdf-queue
    restart: unless-stopped
    command: php artisan queue:work --tries=3
    volumes:
      - .:/var/www/html
      - ./storage:/var/www/html/storage
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_HOST=db
      - DB_DATABASE=image2pdf
      - DB_USERNAME=app_user
      - DB_PASSWORD=secret
    depends_on:
      - app
    networks:
      - image2pdf-network

  db:
    image: mysql:8.0
    container_name: image2pdf-db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=rootsecret
      - MYSQL_DATABASE=image2pdf
      - MYSQL_USER=app_user
      - MYSQL_PASSWORD=secret
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - image2pdf-network

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: image2pdf-scheduler
    restart: unless-stopped
    command: >
      sh -c "while true; do
        php artisan schedule:run --verbose --no-interaction &
        sleep 60
      done"
    volumes:
      - .:/var/www/html
      - ./storage:/var/www/html/storage
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    depends_on:
      - app
    networks:
      - image2pdf-network

networks:
  image2pdf-network:
    driver: bridge

volumes:
  db_data: